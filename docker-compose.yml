services:
  db:
    image: postgres:16
    ports:
      - 5434:5432
    environment:
      POSTGRES_DB: temp2
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    volumes:
      - pgdata2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d temp1"]
      interval: 3s
      retries: 5
  app:
    build: ./backend
    ports: ["8000","8000"]
    environment:
      key: value
    volumes: 
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./xvector-ember
    ports:
      - 4200:80
    depends_on:
      - app
volumes:
  pgdata2:
  uploads:
